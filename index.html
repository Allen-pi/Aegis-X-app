<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover'>
  
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <title>Aegis-X Console</title>
  <style>
    :root.dark {
      --bg-gradient: radial-gradient(circle at 50% 15%, #131c31 0%, #070a12 85%);
      --card: rgba(19, 27, 46, 0.85);
      --card-bg: #131b2e;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --ring-track: #1e293b;
      --active-accent: #38bdf8;
      --btn-bg: rgba(30, 41, 59, 0.9);
    }
    :root.light {
      --bg-gradient: radial-gradient(circle at 50% 15%, #ffffff 0%, #e2e8f0 85%);
      --card: rgba(255, 255, 255, 0.95);
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --ring-track: #cbd5e1;
      --active-accent: #0284c7;
      --btn-bg: #f8fafc;
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    
    html, body { 
      width: 100%; height: 100%; min-height: 100svh;
      margin: 0; padding: 0; 
      overflow: hidden !important; 
      overscroll-behavior: none !important; 
      background: var(--bg-gradient); color: var(--text); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      padding: max(env(safe-area-inset-top, 6px), 6px) 12px max(env(safe-area-inset-bottom, 6px), 6px) 12px; 
      transition: background 0.3s, color 0.3s; 
    }

    .app-disabled-mask {
      filter: grayscale(1) opacity(0.35) blur(0.5px) !important;
      pointer-events: none !important;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .main-interactive-area {
      width: 100%; max-width: 415px; display: flex; flex-direction: column; 
      align-items: center; gap: 6px; flex: 1; justify-content: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 顶栏 Logo */
    .header-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 415px; height: 34px; z-index: 10; flex-shrink: 0; }
    .brand-box { display: flex; align-items: center; }
    .brand-logo-text { font-size: 19px; font-weight: 900; letter-spacing: 1.5px; background: linear-gradient(135deg, #38bdf8, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 2px 6px rgba(56, 189, 248, 0.3)); }

    .right-compact-group { display: flex; align-items: center; gap: 10px; }
    .net-badge { font-size: 12px; color: var(--subtext); background: transparent; border: none; padding: 0; cursor: pointer; font-weight: bold; }
    .lang-sel { background: transparent; color: var(--subtext); border: none; font-size: 12px; outline: none; font-weight: bold; padding: 0; cursor: pointer; }
    
    .battery-pill { display: flex; align-items: center; gap: 5px; background: transparent; border: none; padding: 0; }
    .battery-shell { width: 24px; height: 12px; border: 1.5px solid var(--subtext); border-radius: 3px; padding: 0.5px; position: relative; display: flex; align-items: center; }
    .battery-shell::after { content: ''; position: absolute; right: -3.5px; top: 2px; width: 1.5px; height: 4px; background: var(--subtext); border-radius: 0 1px 1px 0; }
    .battery-fill { height: 100%; width: 100%; background: #22c55e; border-radius: 0.5px; }
    .battery-txt { font-size: 12px; font-weight: bold; color: var(--subtext); }

    /* Wi-Fi 弹窗 (纯白风格 + 密码可见眼睛) */
    #wifiModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.65); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(6px); }
    .wifi-card { background: #ffffff; color: #0f172a; width: 88%; max-width: 320px; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .wifi-input { background: #f8fafc; border: 1px solid #cbd5e1; color: #0f172a; padding: 10px 36px 10px 10px; border-radius: 8px; font-size: 13px; outline: none; width: 100%; }
    .pass-container { position: relative; display: flex; align-items: center; width: 100%; }
    .eye-btn { position: absolute; right: 10px; background: none; border: none; cursor: pointer; font-size: 16px; padding: 0; color: #64748b; }

    /* OTA 升级进度弹窗 */
    #otaModal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
    .ota-card { background: var(--card-bg); color: var(--text); width: 85%; max-width: 300px; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); }
    .progress-track { width: 100%; height: 10px; background: rgba(148, 163, 184, 0.2); border-radius: 5px; overflow: hidden; position: relative; }
    .progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #a855f7); border-radius: 5px; transition: width 0.2s ease; }

    /* 温度设置圆环 (直径增大1.5倍) */
    .circle-control-section { 
      display: flex; flex-direction: column; align-items: center; justify-content: center; 
      position: relative; width: 100%; margin: 0;
    }
    
    .ring-wrapper { 
      position: relative; width: 102vw; height: 102vw; max-width: 375px; max-height: 375px; min-width: 300px; min-height: 300px; 
      display: flex; align-items: center; justify-content: center; cursor: pointer; 
    }
    
    .temp-ring-outer {
      position: absolute; width: 100%; height: 100%; border-radius: 50%;
      background: var(--ring-track);
      -webkit-mask: radial-gradient(transparent 56%, #000 57%);
      mask: radial-gradient(transparent 56%, #000 57%);
      transition: background 0.12s ease;
      filter: drop-shadow(0 0 14px rgba(56, 189, 248, 0.45));
    }

    .temp-ring-inner {
      width: 68%; height: 68%; 
      background: radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.18) 0%, rgba(168, 85, 247, 0.14) 60%, var(--card-bg) 100%);
      backdrop-filter: blur(16px);
      border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 2; pointer-events: none;
      box-shadow: inset 0 0 22px rgba(168, 85, 247, 0.3), 0 8px 20px rgba(0,0,0,0.3);
    }

    .main-temp-val { 
      font-size: 76px; font-weight: 200; letter-spacing: -3px; line-height: 0.85; 
      color: #38bdf8; 
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }
    .main-temp-unit { font-size: 26px; color: var(--subtext); font-weight: 300; margin-left: 2px; }
    .mode-tag-pill { font-size: 13px; font-weight: 800; color: var(--active-accent); text-transform: uppercase; letter-spacing: 1.2px; margin-top: 4px; }
    .min-max-labels { display: flex; justify-content: space-between; width: 102vw; max-width: 375px; min-width: 300px; margin-top: -2px; font-size: 13px; font-weight: bold; color: var(--subtext); padding: 0 4px; }

    /* 温湿度显示区 */
    .sensors-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 415px; }
    .sensor-card {
      background: transparent; border: none;
      padding: 2px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    }
    .sensor-icon { font-size: 30px; line-height: 1; display: flex; align-items: center; justify-content: center; height: 34px; }
    .jacket-3d-svg { width: 34px; height: 34px; filter: drop-shadow(0px 2px 6px rgba(56, 189, 248, 0.6)); transform: perspective(200px) rotateX(10deg); }
    .sensor-info { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .sensor-lbl { font-size: 13px; color: var(--subtext); font-weight: bold; }
    .sensor-val { font-size: 16px; font-weight: 800; }

    /* 控制区域 */
    .controls-grid { 
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; max-width: 415px; 
    }
    .ctrl-tile { 
      background: var(--card); backdrop-filter: blur(14px); 
      border-radius: 16px; 
      padding: 10px 4px; height: 185px;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between; 
      position: relative; overflow: hidden;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    }

    .ctrl-top-val { font-size: 15px; font-weight: 900; color: var(--active-accent); line-height: 1; display: flex; align-items: baseline; gap: 2px; }
    .ctrl-mid-body { display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 115px; width: 100%; z-index: 5; position: relative; }
    
    .adj-btn { 
      width: 38px; height: 24px; background: var(--btn-bg); border: 1px solid rgba(255,255,255,0.1); 
      border-radius: 7px; display: flex; align-items: center; justify-content: center; 
      font-size: 16px; font-weight: bold; color: var(--text); cursor: pointer; z-index: 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    
    .slider-track-container { 
      position: relative; width: 30px; height: 60px; 
      background: rgba(15, 23, 42, 0.5); 
      border-radius: 8px; 
      display: flex; align-items: center; justify-content: center; 
      cursor: pointer;
      touch-action: none; 
    }

    .slider-fill-bar {
      position: absolute; bottom: 0; left: 0; width: 100%;
      background: linear-gradient(to top, #38bdf8 0%, #c084fc 100%);
      border-radius: 7px;
      pointer-events: none;
      transition: height 0.05s linear;
      opacity: 0.9;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }

    .slider-thumb { 
      position: absolute; width: 24px; height: 14px; 
      background: #ffffff; 
      border-radius: 4px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.45), 0 0 6px rgba(56, 189, 248, 0.9); 
      pointer-events: none; 
      transition: bottom 0.05s linear; 
      z-index: 2;
    }

    .ctrl-bot-name { font-size: 12px; color: var(--subtext); font-weight: bold; text-align: center; pointer-events: none; }

    /* 独立开关按键 */
    .power-dock-row {
      display: flex; justify-content: center; align-items: center; width: 100%; margin: 2px 0; z-index: 500; flex-shrink: 0;
    }
    .embedded-power-btn {
      width: 86px; height: 86px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #a855f7);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 5px 18px rgba(168, 85, 247, 0.5), 0 0 0 3px var(--card-bg);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .power-icon { width: 42px; height: 42px; fill: white; }

    /* 底部工具与版本栏 */
    .bottom-action-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 415px; height: 28px; z-index: 10; flex-shrink: 0; }
    
    .theme-drawer-wrapper { display: flex; align-items: center; position: relative; }
    .theme-trigger-btn { background: transparent; border: none; font-size: 12px; font-weight: bold; color: var(--subtext); cursor: pointer; padding: 2px 0; display: flex; align-items: center; gap: 5px; }
    .theme-options-drawer { 
      display: flex; gap: 6px; opacity: 0; max-width: 0; overflow: hidden; transition: all 0.3s ease; 
      margin-left: 0; background: transparent; border: none;
    }
    .theme-options-drawer.open { opacity: 1; max-width: 180px; margin-left: 8px; }
    .t-btn-flat { background: transparent; border: none; color: var(--subtext); font-size: 11px; font-weight: bold; padding: 2px 5px; cursor: pointer; }
    .t-btn-flat.active { color: var(--active-accent); text-decoration: underline; font-weight: 900; }

    .version-area { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--subtext); }
    .ota-check-btn { background: none; border: 1px solid rgba(255,255,255,0.2); color: #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }

    #lowBattAlert { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(239, 68, 68, 0.95); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; text-align: center; padding: 20px; }
  </style>
</head>
<body>

  <!-- 极低电量警报 -->
  <div id='lowBattAlert'>
    <div style='font-size: 40px; margin-bottom: 10px;'>⚡⚠️⚡</div>
    <h2>极低电量紧急警报！</h2>
    <p>电量低于 3%，系统已实施安全保护断电！</p>
  </div>

  <!-- Wi-Fi 弹窗 (纯白风格 + 密码可见切换) -->
  <div id='wifiModal' onclick='if(event.target.id=="wifiModal") closeWifiModal()'>
    <div class='wifi-card'>
      <div style='font-weight: bold; font-size: 15px; color: #0f172a;' id='wifiModalTitle'>连接目标 Wi-Fi</div>
      <input type='text' id='ssidInput' class='wifi-input' placeholder='Wi-Fi 名称 (SSID)'>
      <div class='pass-container'>
        <input type='password' id='passInput' class='wifi-input' placeholder='Wi-Fi 密码' style='padding-right: 36px;'>
        <button type='button' class='eye-btn' id='eyeToggleBtn' onclick='togglePasswordVisibility()'>👁️</button>
      </div>
      <div style='display: flex; gap: 8px; margin-top: 4px;'>
        <button style='flex:1; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; background: #f8fafc; color: #0f172a; font-weight: bold;' id='wifiCancelBtn' onclick='closeWifiModal()'>取消</button>
        <button style='flex:1; padding: 10px; border-radius: 8px; border: none; background: #0284c7; color: white; font-weight: bold;' id='wifiConnBtn' onclick='saveWifi()'>连接</button>
      </div>
    </div>
  </div>

  <!-- OTA 升级进度弹窗 -->
  <div id='otaModal'>
    <div class='ota-card'>
      <div style='font-weight: bold; font-size: 15px;' id='otaTitle'>系统固件升级中...</div>
      <div style='font-size: 12px; color: var(--subtext); text-align: center;' id='otaDesc'>正在下载并刷写新版本，请勿断开电源！</div>
      <div class='progress-track'>
        <div class='progress-fill' id='otaProgressFill'></div>
      </div>
      <div style='font-weight: bold; font-size: 14px; color: var(--active-accent);' id='otaPercentText'>0%</div>
    </div>
  </div>

  <!-- 1. 顶栏 -->
  <div class='header-bar' id='headerBar'>
    <div class='brand-box'>
      <span class="brand-logo-text">AEGIS-X</span>
    </div>
    <div class='right-compact-group'>
      <div class='net-badge' id='netStatus' onclick='openWifiModal()'>🌐 离线</div>
      <select class='lang-sel' id='langSel' onchange='changeLang(this.value)'>
        <option value='zh'>中文</option>
        <option value='en'>EN</option>
        <option value='ja'>日本語</option>
        <option value='ko'>한국어</option>
        <option value='ar'>العربية</option>
        <option value='hi'>हिन्दी</option>
        <option value='af'>Afrikaans</option>
        <option value='de'>Deutsch</option>
        <option value='fr'>Français</option>
      </select>
      <div class='battery-pill'>
        <div class='battery-shell'><div class='battery-fill' id='battFill'></div></div>
        <span class='battery-txt'><span id='battVal'>--</span>%</span>
      </div>
    </div>
  </div>

  <!-- 主交互区 -->
  <div class='main-interactive-area' id='lockableZone'>

    <!-- 2. 温度设置圆环 -->
    <div class='circle-control-section'>
      <div class='ring-wrapper' id='ringWrapper'>
        <div class='temp-ring-outer' id='tempRingOuter'></div>
        <div class='temp-ring-inner'>
          <div style='display: flex; align-items: baseline;'>
            <span class='main-temp-val' id='targetTempDisp'>18</span>
            <span class='main-temp-unit'>°</span>
          </div>
          <div class='mode-tag-pill' id='modeTagDisp'>AUTO</div>
        </div>
      </div>
      <div class='min-max-labels'>
        <span style='color: #38bdf8;'>15℃</span>
        <span style='color: #f87171;'>30℃</span>
      </div>
    </div>

    <!-- 3. 温湿度显示区 -->
    <div class='sensors-row'>
      <div class='sensor-card'>
        <div class='sensor-icon'>
          <svg class="jacket-3d-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="jacketBody" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#0284c7"/>
              </linearGradient>
              <linearGradient id="jacketCollar" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#7dd3fc"/>
                <stop offset="100%" stop-color="#0369a1"/>
              </linearGradient>
            </defs>
            <path d="M16 16 L24 8 L40 8 L48 16 L56 22 L48 30 L48 56 L16 56 L16 30 L8 22 Z" fill="url(#jacketBody)" stroke="#bae6fd" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M24 8 L32 24 L40 8" fill="url(#jacketCollar)"/>
            <path d="M32 24 L32 56" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 1.5"/>
          </svg>
        </div>
        <div class='sensor-info'>
          <span class='sensor-lbl' id='lblSuit'>衣内温湿度</span>
          <span class='sensor-val'><span id='gTemp'>--</span>°C / <span id='gHum'>--</span>%</span>
        </div>
      </div>

      <div class='sensor-card'>
        <div class='sensor-icon'>🌍</div>
        <div class='sensor-info'>
          <span class='sensor-lbl' id='lblAmb'>环境温湿度</span>
          <span class='sensor-val'><span id='aTemp'>--</span>°C / <span id='aHum'>--</span>%</span>
        </div>
      </div>
    </div>

    <!-- 4. 控制卡片区 (挡位支持 0~5 档) -->
    <div class='controls-grid'>
      <!-- 冷热档位 (0~5) -->
      <div class='ctrl-tile' id='tileCooling'>
        <div class='ctrl-top-val'>
          <span id='gearDisp'>3</span><span id='gearUnit' style='font-size: 12px; font-weight: bold;'>档</span>
        </div>
        <div class='ctrl-mid-body'>
          <div class='adj-btn' onclick='adjustValue("cooling", 1, event)'>+</div>
          <div class='slider-track-container' id='trackCooling' data-type='cooling'>
            <div class='slider-fill-bar' id='fillCooling' style='height: 50%;'></div>
            <div class='slider-thumb' id='thumbCooling' style='bottom: calc(50% - 7px);'></div>
          </div>
          <div class='adj-btn' onclick='adjustValue("cooling", -1, event)'>−</div>
        </div>
        <div class='ctrl-bot-name' id='lblGear'>冷热挡位</div>
      </div>

      <!-- 循环水泵 -->
      <div class='ctrl-tile' id='tilePump'>
        <div class='ctrl-top-val'><span id='pumpDisp'>70</span>%</div>
        <div class='ctrl-mid-body'>
          <div class='adj-btn' onclick='adjustValue("pump", 5, event)'>+</div>
          <div class='slider-track-container' id='trackPump' data-type='pump'>
            <div class='slider-fill-bar' id='fillPump' style='height: 70%;'></div>
            <div class='slider-thumb' id='thumbPump' style='bottom: calc(70% - 7px);'></div>
          </div>
          <div class='adj-btn' onclick='adjustValue("pump", -5, event)'>−</div>
        </div>
        <div class='ctrl-bot-name' id='lblPump'>循环水泵</div>
      </div>

      <!-- 散热风机 -->
      <div class='ctrl-tile' id='tileFan'>
        <div class='ctrl-top-val'><span id='fanDisp'>60</span>%</div>
        <div class='ctrl-mid-body'>
          <div class='adj-btn' onclick='adjustValue("fan", 5, event)'>+</div>
          <div class='slider-track-container' id='trackFan' data-type='fan'>
            <div class='slider-fill-bar' id='fillFan' style='height: 60%;'></div>
            <div class='slider-thumb' id='thumbFan' style='bottom: calc(60% - 7px);'></div>
          </div>
          <div class='adj-btn' onclick='adjustValue("fan", -5, event)'>−</div>
        </div>
        <div class='ctrl-bot-name' id='lblFan'>散热风机</div>
      </div>

      <!-- 工作模式切换卡片 -->
      <div class='ctrl-tile' onclick='toggleMode()' style='cursor: pointer;'>
        <div class='ctrl-top-val' id='modeSubDisp'>制冷</div>
        <div class='ctrl-mid-body' style='justify-content: center;'>
          <div style='font-size: 34px;' id='modeIcon'>❄️</div>
        </div>
        <div class='ctrl-bot-name' id='lblMode'>工作模式</div>
      </div>
    </div>

  </div>

  <!-- 5. 独立开关按键 -->
  <div class='power-dock-row'>
    <div class='embedded-power-btn' id='powerCircleBtn' onclick='togglePower()'>
      <svg class='power-icon' id='powerSvg' viewBox='0 0 24 24'>

      fr: { suit: "Temp/Hum Comb", amb: "Temp/Hum Amb", gear: "Niveau Puiss", gearUnit: "N", pump: "Pompe à eau", fan: "Ventilateur", mode: "Mode", themeTrigger: "Thème", dark: "Sombre", light: "Clair", auto: "Auto", modes: ["Froid", "Chaud", "Sec", "Smart"], modeTags: ["❄️ COOL", "🔥 HEAT", "💧 DRY", "🤖 AUTO"], otaBtn: "Mettre à jour", netOffline: "🌐 Hors ligne", netOnline: "☁️ Cloud", wifiTitle: "Connexion Wi-Fi", ssidPlaceholder: "Nom du réseau", passPlaceholder: "Mot de passe", cancelBtn: "Annuler", connBtn: "Connecter", otaingTitle: "Mise à jour...", otaingDesc: "Téléchargement en cours, ne pas éteindre !" }

    let currentLang = 'zh';
    let isDraggingRing = false;
    let activeSliderType = null;
    let currentTargetTemp = 18.0;
    let isPowerOn = false;
    let isCloudOnline = false;
    let themeTimer = null;

    function saveWifi() {
      const ssid = document.getElementById('ssidInput').value;
      const pass = document.getElementById('passInput').value;
      if(!ssid) { alert("Please enter SSID"); return; }
      fetch(`/api/set_wifi?ssid=${encodeURIComponent(ssid)}&pass=${encodeURIComponent(pass)}`)
        .then(() => { alert("Saved!"); closeWifiModal(); });

    function changeLang(lang) {
      if(!i18n[lang]) return;
      currentLang = lang;
      const d = i18n[lang];
      document.getElementById('lblSuit').innerText = d.suit;
      document.getElementById('lblAmb').innerText = d.amb;
      document.getElementById('lblGear').innerText = d.gear;
      document.getElementById('gearUnit').innerText = d.gearUnit;
      document.getElementById('lblPump').innerText = d.pump;
      document.getElementById('lblFan').innerText = d.fan;
      document.getElementById('lblMode').innerText = d.mode;
      document.getElementById('lblThemeTrigger').innerText = d.themeTrigger;
      document.getElementById('btnDark').innerText = d.dark;
      document.getElementById('btnLight').innerText = d.light;
      document.getElementById('btnAuto').innerText = d.auto;
      document.getElementById('otaBtn').innerText = d.otaBtn;
      
      // Wi-Fi 弹窗多语言实时同步
      document.getElementById('wifiModalTitle').innerText = d.wifiTitle;
      document.getElementById('ssidInput').placeholder = d.ssidPlaceholder;
      document.getElementById('passInput').placeholder = d.passPlaceholder;
      document.getElementById('wifiCancelBtn').innerText = d.cancelBtn;
      document.getElementById('wifiConnBtn').innerText = d.connBtn;
      document.getElementById('otaTitle').innerText = d.otaingTitle;
      document.getElementById('otaDesc').innerText = d.otaingDesc;

      updateNetStatusUI();
      updateData();
    }

    function updateNetStatusUI() {
      const d = i18n[currentLang] || i18n['zh'];
      const net = document.getElementById('netStatus');
      if(isCloudOnline) { net.innerText = d.netOnline; net.style.color = "#4ade80"; } 
      else { net.innerText = d.netOffline; net.style.color = "var(--subtext)"; }
    }

    function autoHideThemeDrawer() {
      if(themeTimer) clearTimeout(themeTimer);
      themeTimer = setTimeout(() => document.getElementById('themeDrawer').classList.remove('open'), 3000);
    }

    function toggleThemeDrawer(e) {
      if(!isPowerOn) return;
      if(e) e.stopPropagation();
      const drawer = document.getElementById('themeDrawer');
      drawer.classList.toggle('open');
      if(drawer.classList.contains('open')) autoHideThemeDrawer();
    }

    function setTheme(mode, e) {
      if(!isPowerOn) return;
      if(e) e.stopPropagation();
      ['btnDark', 'btnLight', 'btnAuto'].forEach(id => document.getElementById(id).classList.remove('active'));
      if (mode === 'dark') { document.getElementById('btnDark').classList.add('active'); document.documentElement.className = 'dark'; }
      else if (mode === 'light') { document.getElementById('btnLight').classList.add('active'); document.documentElement.className = 'light'; }
      else { document.getElementById('btnAuto').classList.add('active'); document.documentElement.className = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      autoHideThemeDrawer();
    }

    function updateSliderUI(type, val) {
      let elemId = (type==='cooling'?'gearDisp':(type==='pump'?'pumpDisp':'fanDisp'));
      let thumbId = (type==='cooling'?'thumbCooling':(type==='pump'?'thumbPump':'thumbFan'));
      let fillId = (type==='cooling'?'fillCooling':(type==='pump'?'fillPump':'fillFan'));
      let min = (type==='cooling'?0:0), max = (type==='cooling'?5:100);
      
      document.getElementById(elemId).innerText = val;
      let pct = ((val - min) / (max - min)) * 100;
      document.getElementById(thumbId).style.bottom = `calc(${pct}% - 7px)`;
      document.getElementById(fillId).style.height = `${pct}%`;
    }

    function adjustValue(type, delta, event) {
      if(!isPowerOn) return;
      if(event) event.stopPropagation();
      let elemId = (type==='cooling'?'gearDisp':(type==='pump'?'pumpDisp':'fanDisp'));
      let min = (type==='cooling'?0:0), max = (type==='cooling'?5:100);
      let curr = parseInt(document.getElementById(elemId).innerText) || 0;
      let newVal = Math.min(Math.max(curr + delta, min), max);
      
      updateSliderUI(type, newVal);
      fetch(`/api/control?type=${type}&val=${newVal}`);
    }

    function handleSliderMove(clientY, container, type) {
      const rect = container.getBoundingClientRect();
      const height = rect.height;
      let offsetY = rect.bottom - clientY;
      let pct = offsetY / height;
      pct = Math.min(Math.max(pct, 0), 1);

      let min = (type === 'cooling' ? 0 : 0);
      let max = (type === 'cooling' ? 5 : 100);
      let val = Math.round(min + pct * (max - min));
      if (type === 'cooling') {
        val = Math.min(Math.max(val, 0), 5);
      } else {
        val = Math.round(val / 5) * 5;
        val = Math.min(Math.max(val, 0), 100);
      }

      updateSliderUI(type, val);
      return val;
    }

    let pendingSliderVal = null;
    let sliderSyncTimer = null;
    function sendSliderToServer(type, val) {
      pendingSliderVal = {type, val};
      if(sliderSyncTimer) clearTimeout(sliderSyncTimer);
      sliderSyncTimer = setTimeout(() => {
        if(pendingSliderVal) {
          fetch(`/api/control?type=${pendingSliderVal.type}&val=${pendingSliderVal.val}`);
          pendingSliderVal = null;
        }
      }, 100);
    }

    ['cooling', 'pump', 'fan'].forEach(type => {
      const track = document.getElementById('track' + type.charAt(0).toUpperCase() + type.slice(1));
      if(!track) return;

      let localVal = 0;
      track.addEventListener('mousedown', (e) => {
        if(!isPowerOn) return;
        activeSliderType = type;
        localVal = handleSliderMove(e.clientY, track, type);
      });
      track.addEventListener('touchstart', (e) => {
        if(!isPowerOn) return;
        activeSliderType = type;
        localVal = handleSliderMove(e.touches[0].clientY, track, type);
      }, {passive: true});

      window.addEventListener('mousemove', (e) => {
        if(activeSliderType === type && isPowerOn) {
          localVal = handleSliderMove(e.clientY, track, type);
        }
      });
      window.addEventListener('touchmove', (e) => {
        if(activeSliderType === type && isPowerOn && e.touches[0]) {
          localVal = handleSliderMove(e.touches[0].clientY, track, type);
        }
      }, {passive: true});

      window.addEventListener('mouseup', () => {
        if(activeSliderType === type) {
          activeSliderType = null;
          sendSliderToServer(type, localVal);
        }
      });
      window.addEventListener('touchend', () => {
        if(activeSliderType === type) {
          activeSliderType = null;
          sendSliderToServer(type, localVal);
        }
      });
    });

    function renderTemperatureRing(temp) {
      const trackColor = getComputedStyle(document.documentElement).getPropertyValue('--ring-track').trim() || '#1e293b';

      if (!isPowerOn) {
        document.getElementById('tempRingOuter').style.background = trackColor;
        document.getElementById('targetTempDisp').style.color = "var(--subtext)";
        document.getElementById('targetTempDisp').style.textShadow = "none";
        return;
      }

      const minTemp = 15.0, maxTemp = 30.0;
      const clamped = Math.min(Math.max(temp, minTemp), maxTemp);
      const pct = (clamped - minTemp) / (maxTemp - minTemp);
      const activeDeg = Math.round(pct * 300);

      document.getElementById('tempRingOuter').style.background = 
        `conic-gradient(from 210deg, #38bdf8 0deg, #c084fc ${activeDeg * 0.6}deg, #f43f5e ${activeDeg}deg, ${trackColor} ${activeDeg}deg 300deg, transparent 300deg)`;

      let r = Math.round(56 + pct * (244 - 56));
      let g = Math.round(189 - pct * (189 - 63));
      let b = Math.round(248 - pct * (248 - 94));
      let tempColor = `rgb(${r}, ${g}, ${b})`;

      const tempValElem = document.getElementById('targetTempDisp');
      tempValElem.style.color = tempColor;
      tempValElem.style.textShadow = `0 0 16px rgba(${r}, ${g}, ${b}, 0.55)`;
    }

    const ringWrapper = document.getElementById('ringWrapper');
    function handleRingDrag(e) {
      if(!isPowerOn) return;
      const rect = ringWrapper.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      let rad = Math.atan2(clientY - centerY, clientX - centerX);
      let deg = rad * (180 / Math.PI);
      if (deg < 0) deg += 360;
      let shiftedDeg = deg - 120;
      if (shiftedDeg < 0) shiftedDeg += 360;

      if (shiftedDeg <= 300) {
        let temp = Math.round((15.0 + (shiftedDeg / 300) * 15.0) * 2) / 2;
        currentTargetTemp = temp;
        document.getElementById('targetTempDisp').innerText = (temp % 1 === 0) ? Math.round(temp) : temp.toFixed(1);
        renderTemperatureRing(temp);
      }
    }

    let syncTimer = null;
    function sendTempToServer(temp) {
      if(syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(() => fetch(`/api/control?type=targetTemp&val=${temp}`), 150);
    }

    ringWrapper.addEventListener('mousedown', (e) => { if(isPowerOn) { isDraggingRing = true; handleRingDrag(e); } });
    window.addEventListener('mousemove', (e) => { if(isDraggingRing && isPowerOn) handleRingDrag(e); });
    window.addEventListener('mouseup', () => { if(isDraggingRing) { isDraggingRing = false; sendTempToServer(currentTargetTemp); } });

    ringWrapper.addEventListener('touchstart', (e) => { if(isPowerOn) { isDraggingRing = true; handleRingDrag(e); } }, {passive: true});
    window.addEventListener('touchmove', (e) => { if(isDraggingRing && isPowerOn) handleRingDrag(e); }, {passive: true});
    window.addEventListener('touchend', () => { if(isDraggingRing) { isDraggingRing = false; sendTempToServer(currentTargetTemp); } });

    function updateData() {
      if (isDraggingRing || activeSliderType) return;

      fetch('/api/status').then(r => r.json()).then(d => {
        isPowerOn = d.systemRunning;
        isCloudOnline = d.cloudConnected;

        const lockableZone = document.getElementById('lockableZone');
        const headerBar = document.getElementById('headerBar');
        
        if (!isPowerOn) {
          lockableZone.classList.add('app-disabled-mask');
          headerBar.classList.add('app-disabled-mask');
        } else {
          lockableZone.classList.remove('app-disabled-mask');
          headerBar.classList.remove('app-disabled-mask');
        }

        document.getElementById('gTemp').innerText = d.garmentTemp.toFixed(1);
        document.getElementById('gHum').innerText = d.garmentHum.toFixed(0);
        document.getElementById('aTemp').innerText = d.ambientTemp.toFixed(1);
        document.getElementById('aHum').innerText = d.ambientHum.toFixed(0);

        currentTargetTemp = d.targetTemp;
        document.getElementById('targetTempDisp').innerText = (d.targetTemp % 1 === 0) ? Math.round(d.targetTemp) : d.targetTemp.toFixed(1);
        
        renderTemperatureRing(d.targetTemp);

        updateSliderUI('cooling', d.cooling);
        updateSliderUI('pump', d.pump);
        updateSliderUI('fan', d.fan);

        const dLang = i18n[currentLang] || i18n['zh'];
        document.getElementById('modeTagDisp').innerText = dLang.modeTags[d.workMode];
        document.getElementById('modeSubDisp').innerText = dLang.modes[d.workMode];
        document.getElementById('modeIcon').innerText = ["❄️", "🔥", "💧", "🤖"][d.workMode];

        document.getElementById('battVal').innerText = d.battery;
        document.getElementById('battFill').style.width = d.battery + '%';
        document.getElementById('lowBattAlert').style.display = (d.battery <= 3) ? 'flex' : 'none';

        const pCircle = document.getElementById('powerCircleBtn');
        const pSvg = document.getElementById('powerSvg');
        if (d.systemRunning) {
          pCircle.style.background = 'linear-gradient(135deg, #38bdf8, #a855f7)';
          pCircle.style.boxShadow = '0 5px 18px rgba(168, 85, 247, 0.5), 0 0 0 3px var(--card-bg)';
          pSvg.style.fill = 'white';
        } else {
          pCircle.style.background = 'var(--btn-bg)';
          pCircle.style.boxShadow = '0 0 0 3px var(--card-bg)';
          pSvg.style.fill = 'var(--subtext)';
        }

        updateNetStatusUI();
      });
    }

    function togglePower() { fetch('/api/toggle_power').then(() => updateData()); }
    function toggleMode() { if(isPowerOn) fetch('/api/toggle_mode').then(() => updateData()); }

    // 带动态进度条的 OTA 升级函数
    function doOta() { 
      if(!isPowerOn) return;
      if(!confirm("确定要开始升级系统固件吗？")) return;

      const otaModal = document.getElementById('otaModal');
      const fillBar = document.getElementById('otaProgressFill');
      const percentTxt = document.getElementById('otaPercentText');
      otaModal.style.display = 'flex';
      fillBar.style.width = '0%';
      percentTxt.innerText = '0%';

      fetch('/api/start_ota', {method:'POST'}).then(r => r.json()).then(res => {
        // 模拟平滑进度推进
        let progress = 0;
        const interval = setInterval(() => {
          progress += Math.floor(Math.random() * 8) + 3;
          if (progress > 95) progress = 95;
          fillBar.style.width = progress + '%';
          percentTxt.innerText = progress + '%';
        }, 300);

        // 10秒后自动刷新页面或提示完成
        setTimeout(() => {
          clearInterval(interval);
          fillBar.style.width = '100%';
          percentTxt.innerText = '100%';
          setTimeout(() => {
            alert("固件升级成功，设备即将重启！");
            location.reload();
          }, 1000);
        }, 8000);
      }).catch(err => {
        otaModal.style.display = 'none';
        alert("升级请求发送失败，请检查网络连接。");
      });
    }

    setTheme('auto');
    setInterval(updateData, 1500);
    updateData();
  </script>
</body>
</html>
